name: CurseForge modpack fallback smoke

# Manual-only integration test. Downloaded modpack content remains in
# RUNNER_TEMP, is deleted by the smoke script, and is never uploaded.
on:
  workflow_dispatch:
    inputs:
      pack_id:
        description: CurseForge modpack project ID
        required: true
        type: string
      file_id:
        description: CurseForge client-pack file ID with no dedicated server pack
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-modpack-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  curseforge-smoke:
    name: CurseForge fallback smoke (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      QT_VERSION: 6.10.2
      QT_ARCH: win64_msvc2022_64
      QT_ROOT: C:\Qt
      BUILD_DIRECTORY: ${{ github.workspace }}\build-curseforge-smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the pinned Qt SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to install aqtinstall 3.3.0.'
          }
          $sevenZip = (Get-Command 7z -ErrorAction Stop).Source
          $qtPrefix = Join-Path $env:QT_ROOT "$env:QT_VERSION\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $qtPrefix | Out-Null
          $aqtConfig = (Resolve-Path -LiteralPath `
              (Join-Path $env:GITHUB_WORKSPACE '.github\aqt-settings.ini')).Path
          $aqtWorkingDirectory = Join-Path $env:RUNNER_TEMP 'aqt-work'
          New-Item -ItemType Directory -Force -Path $aqtWorkingDirectory | Out-Null
          $aqtExitCode = 1
          Push-Location $aqtWorkingDirectory
          try {
              python -m aqt --config $aqtConfig `
                  install-qt windows desktop $env:QT_VERSION $env:QT_ARCH `
                  -m qtimageformats qtnetworkauth --outputdir $env:QT_ROOT --external $sevenZip
              $aqtExitCode = $LASTEXITCODE
          }
          finally {
              Pop-Location
          }
          if ($aqtExitCode -ne 0) {
              throw "Unable to install Qt $env:QT_VERSION."
          }
          if (-not (Test-Path -LiteralPath "$qtPrefix\lib\cmake\Qt6" -PathType Container)) {
              throw "Qt CMake package was not installed at $qtPrefix."
          }

      - name: Bootstrap the pinned vcpkg submodule
        shell: pwsh
        run: |
          & .\cmake\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to bootstrap the repository vcpkg revision.'
          }

      - name: Build the server projection test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtPrefix = Join-Path $env:QT_ROOT "$env:QT_VERSION\msvc2022_64"
          $toolchain = Join-Path $env:GITHUB_WORKSPACE `
              'cmake\vcpkg\scripts\buildsystems\vcpkg.cmake'
          $configureArguments = @(
              '-S', $env:GITHUB_WORKSPACE,
              '-B', $env:BUILD_DIRECTORY,
              '-G', 'Visual Studio 17 2022',
              '-A', 'x64',
              '-DBUILD_TESTING=ON',
              '-DLauncher_USE_PCH=OFF',
              '-DENABLE_LTO=OFF',
              '-DLauncher_RELEASE_STAGE=development',
              '-DLauncher_BUILD_ARTIFACT=curseforge-smoke',
              '-DLauncher_BUILD_PLATFORM=Windows-MSVC-x64',
              '-DLauncher_ENABLE_JAVA_DOWNLOADER=ON',
              '-DLauncher_UPDATER_GITHUB_REPO=',
              '-DLauncher_CURSEFORGE_API_KEY=',
              "-DCMAKE_PREFIX_PATH=$qtPrefix",
              "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
              '-DVCPKG_TARGET_TRIPLET=x64-windows'
          )
          & cmake @configureArguments
          if ($LASTEXITCODE -ne 0) {
              throw 'CurseForge smoke CMake configuration failed.'
          }
          & cmake --build $env:BUILD_DIRECTORY --config Debug `
              --target ServerManager --parallel 2
          if ($LASTEXITCODE -ne 0) {
              throw 'CurseForge smoke build failed.'
          }

      - name: Run protected CurseForge fallback smoke
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          SMOKE_PACK_ID: ${{ inputs.pack_id }}
          SMOKE_FILE_ID: ${{ inputs.file_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_API_KEY)) {
              throw 'The CURSEFORGE_API_KEY Actions secret is missing or empty.'
          }
          Write-Output "::add-mask::$env:CURSEFORGE_API_KEY"

          $qtBin = Join-Path $env:QT_ROOT "$env:QT_VERSION\msvc2022_64\bin"
          $vcpkgBin = Join-Path $env:BUILD_DIRECTORY `
              'vcpkg_installed\x64-windows\bin'
          $testExecutable = Join-Path $env:BUILD_DIRECTORY `
              'Debug\ServerManager.exe'
          & .\scripts\curseforge-modpack-smoke.ps1 `
              -PackId ([int] $env:SMOKE_PACK_ID) `
              -FileId ([int] $env:SMOKE_FILE_ID) `
              -CurseForgeApiKey $env:CURSEFORGE_API_KEY `
              -ServerManagerExecutable $testExecutable `
              -QtBin $qtBin `
              -VcpkgBin $vcpkgBin
          if ($LASTEXITCODE -ne 0) {
              throw 'The protected CurseForge fallback smoke failed.'
          }
