name: Build and test

# This fork intentionally validates pull requests and explicit manual runs only.
# It does not run on pushes and does not package, publish, sign, or upload files.
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmark \
            dpkg-dev \
            extra-cmake-modules \
            gamemode-dev \
            libarchive-dev \
            libcmark-dev \
            libqrencode-dev \
            libqt6opengl6-dev \
            libtomlplusplus-dev \
            libxcb-cursor-dev \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-image-formats-plugins \
            qt6-networkauth-dev \
            scdoc \
            zlib1g-dev

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DLauncher_USE_PCH=OFF
          -DENABLE_LTO=OFF
          -DLauncher_BUILD_ARTIFACT=ci
          -DLauncher_BUILD_PLATFORM=Linux
          -DLauncher_UPDATER_GITHUB_REPO=
          -DLauncher_CURSEFORGE_API_KEY=

      - name: Build
        shell: bash
        run: cmake --build build-ci --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir build-ci --output-on-failure --timeout 300
