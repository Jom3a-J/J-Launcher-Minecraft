name: Build and test Windows x64

# Phase 9 supports Windows x64 only. This workflow validates pull requests and
# explicit manual runs without packaging, publishing, signing, or uploading.
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      QT_VERSION: 6.10.2
      QT_ARCH: win64_msvc2022_64
      QT_ROOT: C:\Qt
      BUILD_DIRECTORY: ${{ github.workspace }}\build-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the pinned Qt SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to install aqtinstall 3.3.0.'
          }
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH `
              -m qtimageformats qtnetworkauth --outputdir $env:QT_ROOT
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to install Qt $env:QT_VERSION."
          }

          $qtPrefix = Join-Path $env:QT_ROOT "$env:QT_VERSION\msvc2022_64"
          if (-not (Test-Path -LiteralPath "$qtPrefix\lib\cmake\Qt6" -PathType Container)) {
              throw "Qt CMake package was not installed at $qtPrefix."
          }

      - name: Bootstrap the pinned vcpkg submodule
        shell: pwsh
        run: |
          & .\cmake\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to bootstrap the repository vcpkg revision.'
          }

      - name: Configure, build, and test Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $qtPrefix = Join-Path $env:QT_ROOT "$env:QT_VERSION\msvc2022_64"
          $toolchain = Join-Path $env:GITHUB_WORKSPACE `
              'cmake\vcpkg\scripts\buildsystems\vcpkg.cmake'
          $configureArguments = @(
              '-S', $env:GITHUB_WORKSPACE,
              '-B', $env:BUILD_DIRECTORY,
              '-G', 'Visual Studio 17 2022',
              '-A', 'x64',
              '-DBUILD_TESTING=ON',
              '-DLauncher_USE_PCH=OFF',
              '-DENABLE_LTO=OFF',
              '-DLauncher_RELEASE_STAGE=development',
              '-DLauncher_BUILD_ARTIFACT=ci',
              '-DLauncher_BUILD_PLATFORM=Windows-MSVC-x64',
              '-DLauncher_ENABLE_JAVA_DOWNLOADER=ON',
              '-DLauncher_UPDATER_GITHUB_REPO=',
              '-DLauncher_CURSEFORGE_API_KEY=',
              "-DCMAKE_PREFIX_PATH=$qtPrefix",
              "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
              '-DVCPKG_TARGET_TRIPLET=x64-windows'
          )
          & cmake @configureArguments
          if ($LASTEXITCODE -ne 0) {
              throw 'Windows x64 CMake configuration failed.'
          }

          & cmake --build $env:BUILD_DIRECTORY --config Debug --parallel 2
          if ($LASTEXITCODE -ne 0) {
              throw 'Windows x64 build failed.'
          }

          $env:Path = "$qtPrefix\bin;$env:Path"
          & ctest --test-dir $env:BUILD_DIRECTORY -C Debug `
              --output-on-failure --timeout 300
          if ($LASTEXITCODE -ne 0) {
              throw 'Windows x64 tests failed.'
          }
