name: Seed build caches

# Pull request checks can only reuse caches saved on develop, the default branch. This saves
# the Qt SDK and the built vcpkg packages there, so a pull request does not install or build
# them again. It installs and configures only: no build, no tests. It runs when what it caches
# changes, weekly (the runner image's compiler changes the built packages, and unused caches
# expire after a week), and by hand.
on:
  push:
    branches:
      - develop
    paths:
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'cmake/vcpkg'
      - 'cmake/vcpkg-ports/**'
      - '.github/aqt-settings.ini'
      - '.github/scripts/**'
      - '.github/workflows/cache-seed.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-seed
  cancel-in-progress: false

jobs:
  seed:
    name: Seed Qt and vcpkg caches
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Keep in step with build.yml: the keys below must match the ones it restores.
      QT_VERSION: 6.10.2
      QT_ARCH: win64_msvc2022_64
      QT_ROOT: C:\Qt
      BUILD_DIRECTORY: ${{ github.workspace }}\build-ci
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-binary-cache,readwrite

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the pinned Qt SDK
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.QT_ROOT }}\${{ env.QT_VERSION }}
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-imageformats-networkauth-${{ hashFiles('.github/aqt-settings.ini', '.github/scripts/ci-install-qt.ps1') }}

      - name: Install the pinned Qt SDK
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\.github\scripts\ci-install-qt.ps1

      - name: Save the pinned Qt SDK
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.QT_ROOT }}\${{ env.QT_VERSION }}
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Bootstrap the pinned vcpkg submodule
        id: vcpkg
        shell: pwsh
        run: |
          & .\cmake\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to bootstrap the repository vcpkg revision.'
          }
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE | Out-Null
          $vcpkgRevision = git -C cmake/vcpkg rev-parse HEAD
          "vcpkg_revision=$vcpkgRevision" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-x64-windows-${{ steps.vcpkg.outputs.vcpkg_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**') }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: |
            vcpkg-x64-windows-${{ steps.vcpkg.outputs.vcpkg_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**') }}-

      - name: Build the vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        # Configuring runs vcpkg exactly as the pull request check does, which builds the
        # packages into the binary cache.
        run: .\.github\scripts\ci-configure.ps1

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
